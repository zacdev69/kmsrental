<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>KMS Rental — Mercedes-Benz A200 AMG Line</title>
</head>
<body style="margin:0;background:#050607;color:#f5f3ed">
<script>
(async()=>{
  try{
    const stableUrl="https://raw.githubusercontent.com/zacdev69/kmsrental/a3ed490915c1b629b8c0265a6663160aeccd743f/index.html?cb="+Date.now();
    const sourceUrl="./KMS_A200_AMG_Service_Catalog_EN_V12_1_FINAL_REFINED.html?cb="+Date.now();
    const r=await fetch(stableUrl,{cache:"no-store"});
    let h=await r.text();
    if(!h || h.length<10000) throw new Error("stable build unavailable");
    h=h.replace(/KMS_A200_AMG_Service_Catalog_EN_V12_1_FINAL_REFINED\.html[^'\"]*/g,"KMS_DISABLED_SOURCE");
    const css=`
      .kms-brand-img{display:block;width:142px;height:58px;object-fit:contain;object-position:left center}
      .kms-hero-carousel{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;border-radius:16px;background:#0b0e0f;border:1px solid #292d30;isolation:isolate}
      .kms-hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .65s ease;pointer-events:none}
      .kms-hero-slide.is-active{opacity:1;pointer-events:auto}
      .kms-hero-slide img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
      .kms-hero-dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px;z-index:5}
      .kms-hero-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.42);border:0;padding:0;transition:all .25s ease}
      .kms-hero-dot.is-active{width:18px;border-radius:6px;background:#f1d48b}
      .kms-hero-caption{position:absolute;left:12px;bottom:11px;z-index:5;padding:6px 9px;border-radius:7px;background:rgba(5,6,7,.62);backdrop-filter:blur(5px);font-size:7px;font-weight:900;letter-spacing:1.45px;color:#f2eee4}
      .hero-img{width:100%;height:auto!important;aspect-ratio:16/10;overflow:hidden}
      .hero-img>img{width:100%;height:100%;object-fit:cover;display:block}
      @media(max-width:700px){
        .kms-brand-img{width:125px;height:54px}
        .kms-hero-carousel{aspect-ratio:16/10;border-radius:15px}
        .kms-hero-caption{left:9px;bottom:9px;font-size:6.5px;padding:5px 7px}
        .kms-hero-dots{bottom:9px;gap:5px}
        .kms-hero-dot{width:4px;height:4px}
        .kms-hero-dot.is-active{width:15px}
      }
    `;
    const sourceScript=`
      (async()=>{
        try{
          const r=await fetch("${sourceUrl}",{cache:"no-store"});
          const s=await r.text();
          const d=new DOMParser().parseFromString(s,"text/html");
          const logo=d.querySelector("img.logo");
          const hero=d.querySelector("img.hero-desktop");
          const visuals=[
            hero,
            d.querySelector('img[alt*="airport" i]'),
            d.querySelector('img[alt*="wedding" i]'),
            d.querySelector('img[alt*="couple" i]')
          ].filter(Boolean);
          const brand=document.querySelector(".brand");
          if(brand && logo){
            brand.innerHTML="";
            const li=document.createElement("img");
            li.className="kms-brand-img";
            li.src=logo.getAttribute("src");
            li.alt="KMS Rental — Drive a Better Tomorrow";
            brand.appendChild(li);
          }
          const oldHero=document.querySelector(".hero-img");
          if(oldHero && visuals.length){
            const carousel=document.createElement("div");
            carousel.className="kms-hero-carousel";
            const dots=document.createElement("div");
            dots.className="kms-hero-dots";
            const labels=["KMS RENTAL · A200 AMG LINE","CHAUFFEUR · AIRPORT & HOTEL","WEDDING · SPECIAL OCCASION","COUPLES · CITY LEISURE"];
            visuals.forEach((v,i)=>{
              const slide=document.createElement("div");
              slide.className="kms-hero-slide"+(i===0?" is-active":"");
              const im=document.createElement("img");
              im.src=v.getAttribute("src");
              im.alt=v.getAttribute("alt")||"KMS Rental Mercedes-Benz A200 AMG Line";
              slide.appendChild(im);
              carousel.appendChild(slide);
              const dot=document.createElement("button");
              dot.type="button";
              dot.className="kms-hero-dot"+(i===0?" is-active":"");
              dot.setAttribute("aria-label","Show slide "+(i+1));
              dot.addEventListener("click",()=>show(i));
              dots.appendChild(dot);
            });
            const cap=document.createElement("div");
            cap.className="kms-hero-caption";
            cap.textContent=labels[0];
            carousel.appendChild(cap);
            carousel.appendChild(dots);
            oldHero.replaceWith(carousel);
            const slides=[...carousel.querySelectorAll(".kms-hero-slide")];
            const ds=[...dots.children];
            let current=0;
            let timer;
            function show(i){
              current=i%slides.length;
              slides.forEach((x,n)=>x.classList.toggle("is-active",n===current));
              ds.forEach((x,n)=>x.classList.toggle("is-active",n===current));
              cap.textContent=labels[current]||labels[0];
              clearInterval(timer);
              timer=setInterval(()=>show(current+1),4500);
            }
            timer=setInterval(()=>show(current+1),4500);
            let startX=0;
            carousel.addEventListener("touchstart",e=>{startX=e.touches[0].clientX},{passive:true});
            carousel.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>45)show(current+(dx<0?1:-1));},{passive:true});
          }else if(oldHero && hero){
            const hi=oldHero.querySelector("img");
            if(hi) hi.src=hero.getAttribute("src");
          }
          document.querySelectorAll(".kms-visuals").forEach(x=>x.remove());
          document.documentElement.dataset.kmsVersion="12.11-hero-carousel-16x10";
        }catch(e){}
      })()
    `;
    const LT=String.fromCharCode(60), GT=String.fromCharCode(62);
    const styleTag=LT+"style"+GT+css+LT+"/style"+GT;
    const scriptTag=LT+"script"+GT+sourceScript+LT+"/scr"+"ipt"+GT;
    h=h.replace("</head>",styleTag+"</head>");
    h=h.replace("</body>",scriptTag+"</body>");
    document.open(); document.write(h); document.close();
  }catch(e){
    document.body.innerHTML="<main style='padding:24px;font:16px Arial'>KMS Rental is loading. Please refresh once.</main>";
  }
})();
</script>
</body>
</html>
