<script>
(function(){

  const css=`

}

`;
  function patch(){
    try{
      const d=frame.contentDocument;
      if(!d||!d.body)return;
      if(!d.getElementById('kms-v12-1-final-css')){const st=d.createElement('style');st.id='kms-v12-1-final-css';st.textContent=css;d.head.appendChild(st)}
      if(d.title)d.title='KMS Rental | A200 AMG Service Catalogue — V12.1';
      const ps=d.querySelector('.hero-copy .price-strip');
      if(ps)ps.innerHTML=`<div class="price-card"><div class="premium-label"><span>PREMIUM FLEX</span></div><div class="big limited-price">RM499</div><small>per day · unlimited mileage</small></div><div class="price-card"><div class="limited-offer"><span>LIMITED OFFER</span></div><div class="big limited-price">RM390 / RM288</div><small>RM390/day · minimum 3 days · RM288/day · 4 days+</small></div>`;
      const rates=d.querySelector('#rates .split');
      if(rates)rates.innerHTML=`<div class="panel"><div class="premium-label"><span>PREMIUM FLEX</span></div><div class="limited-price" style="font-size:clamp(42px,5vw,64px);margin-top:12px">RM499</div><div class="muted">per day · unlimited mileage</div><div class="trigger-panel"><div class="limited-offer"><span>LIMITED OFFER</span></div><b class="trigger-title">Longer rental trigger</b><div class="trigger-rates">RM390/day <span>· minimum 3 days</span> &nbsp;|&nbsp; RM288/day <span>· 4 days+</span></div></div><div class="rate-grid" style="margin-top:16px"><div class="rate"><b>3 Hours</b><strong>RM300</strong></div><div class="rate"><b>4 Hours</b><strong>RM400</strong></div><div class="rate"><b>1 Day</b><strong>RM499</strong></div><div class="rate"><b>2 Days</b><strong>RM949</strong></div><div class="rate"><b>3 Days</b><strong>RM1,170</strong></div><div class="rate"><b>4 Days</b><strong>RM1,152</strong></div><div class="rate"><b>5 Days</b><strong>RM1,440</strong></div><div class="rate"><b>6 Days</b><strong>RM1,728</strong></div><div class="rate"><b>7 Days</b><strong>RM2,016</strong></div><div class="rate"><b>15–29 Days</b><strong>Quotation</strong></div><div class="rate"><b>Monthly</b><strong>Quotation</strong></div><div class="rate"><b>Corporate</b><strong>Quotation</strong></div></div></div><div class="panel"><div class="kicker">Unlimited Mileage</div><p class="lead" style="font-size:18px;margin-top:12px"><b>Drive without a mileage cap.</b></p><div class="notice" style="margin-top:18px"><b>Security deposit: RM300/day.</b><br>Refundable after vehicle return and inspection, subject to outstanding liabilities or damage.</div><div class="notice" style="margin-top:12px">Self-drive delivery &amp; collection are available within Klang Valley only. RM50 per delivery trip and RM50 per collection trip.</div><div class="notice" style="margin-top:12px">Outside Klang Valley: no delivery or collection service.</div></div>`;
      const pg=d.querySelector('#packages .package-grid');
      if(pg){const p=pg.querySelectorAll('.package');if(p[0])p[0].innerHTML='<h3>Basic</h3><div class="muted">No Decoration</div><div class="amount">RM499 <span class="small">/ day</span></div><ul><li>Mercedes-Benz A200 AMG</li><li>No wedding decoration</li><li>Professional service</li></ul>';if(p[1])p[1].innerHTML='<span class="ribbon neutral-ribbon">WITH DECORATION</span><h3 style="margin-top:16px">Decorated</h3><div class="muted">Wedding decoration included</div><div class="amount">RM699 <span class="small">/ day</span></div><ul><li>Mercedes-Benz A200 AMG</li><li>Wedding decoration included</li><li>Professional wedding setup</li><li>Professional service</li></ul>';}
      d.querySelectorAll('li').forEach(el=>{el.textContent=el.textContent.replace(/Mileage allowance follows rental period\./gi,'Self-Drive mileage is unlimited.').replace(/Excess mileage: RM1\/km\./gi,'No excess mileage charge applies.').replace(/Self-Drive daily allowance is 200 km\/day\./gi,'Self-Drive mileage is unlimited.').replace(/200 km\/day/gi,'Unlimited mileage')});
      d.querySelectorAll('.vip-rate-list li').forEach(el=>{el.textContent=el.textContent.replace(/\s*·\s*Normal.*$/i,'')});
      d.querySelectorAll('.vip-rate-list p').forEach(el=>{el.textContent='VIP chauffeur rates are exclusive member rates.'});
      d.querySelectorAll('.wa-only').forEach(a=>a.classList.remove('cta-red'));
      const weddingSituations=[...d.querySelectorAll('.situation')].find(x=>/Wedding/i.test(x.textContent));if(weddingSituations){const sp=weddingSituations.querySelector('span');if(sp)sp.textContent='Basic and Decorated package options.'}
      const walker=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);const rm=[];while(walker.nextNode()){if(/V11 FINAL AUDIT|V11 FINAL CLEAN AUDIT|final visual audit/i.test(walker.currentNode.nodeValue||''))rm.push(walker.currentNode)}rm.forEach(x=>x.remove());
      const optionScript=[...d.scripts].find(x=>(x.textContent||'').includes('"Wedding"'));if(optionScript){optionScript.textContent=optionScript.textContent.replace('"Wedding":["Basic Package","Signature Package","Premium Package"]','"Wedding":["Basic Package — No Decoration","Decorated Package — RM699"]')}
    }catch(e){console.error('KMS V12.1 patch',e)}
